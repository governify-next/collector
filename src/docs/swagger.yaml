openapi: 3.0.3
info:
    title: Fetcher API
    version: 1.0.0
    description: |
        REST API for discovering and executing fetchers and managing their persisted results.

        Protected operations accept JWT bearer tokens issued for this API. Depending on the
        operation, the token must represent either a user with the documented minimum system
        role or an authenticated service.
servers:
    - url: /

tags:
    - { name: Health, description: Server health check }
    - { name: Fetchers, description: Fetcher management and execution }
    - { name: Fetch Results, description: Fetch result generation and management }
paths:
    # ──────────────────────────────────────────────
    # Health
    # ──────────────────────────────────────────────
    /health:
        get:
            security: []
            tags:
                - Health
            summary: Health check
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    status:
                                        type: string
                                        enum: [ok]
                                        example: ok
                                    message:
                                        type: string
                                        example: Health check passed
                                required:
                                    - status
                                    - message

    # ──────────────────────────────────────────────
    # Fetchers
    # ──────────────────────────────────────────────
    /api/v1/fetchers:
        get:
            security:
                - UserBearerAuth: []
            tags:
                - Fetchers
            summary: Get all fetchers
            operationId: getFetchers
            description: |
                Retrieves all available fetchers and their metadata.
                Requires a user token with the `ADMIN` or `SUPERADMIN` system role.
            responses:
                '200':
                    description: Fetchers retrieved successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Fetcher'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/fetchers/{fetcherId}:
        parameters:
            - $ref: '#/components/parameters/fetcherId'
        get:
            security:
                - UserBearerAuth: []
                - ServiceBearerAuth: []
            tags:
                - Fetchers
            summary: Get fetcher by ID
            operationId: getFetcherById
            description: Retrieves a specific fetcher. Accepts either a user token or a service token.
            responses:
                '200':
                    description: Fetcher retrieved successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Fetcher'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/fetchers/{fetcherId}/fetch:
        parameters:
            - $ref: '#/components/parameters/fetcherId'
        post:
            security:
                - UserBearerAuth: []
            tags:
                - Fetchers
            summary: Execute a fetcher
            operationId: fetchFetcher
            description: |
                Executes the selected fetcher using its configuration.
                Requires a user token with the `SUPERADMIN` system role.
            requestBody:
                $ref: '#/components/requestBodies/FetchFetcherBody'
            responses:
                '200':
                    description: Fetcher result generated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/FetcherExecutionResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/fetchers/{fetcherId}/validate:
        parameters:
            - $ref: '#/components/parameters/fetcherIdCandidate'
        post:
            security:
                - UserBearerAuth: []
                - ServiceBearerAuth: []
            tags:
                - Fetchers
            summary: Validate fetcher configuration
            operationId: validateFetcher
            description: |
                Checks whether the fetcher exists and, when `fetcherConfig` is supplied, validates
                it against the fetcher's schema. An unknown `fetcherId` is reported in the successful
                response as `valid: false`.

                Accepts a service token or a user token with the `SUPERADMIN` system role.
            requestBody:
                $ref: '#/components/requestBodies/ValidateFetcherBody'
            responses:
                '200':
                    description: Fetcher configuration validation completed (valid or invalid).
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/ValidateFetcherResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Fetch Results
    # ──────────────────────────────────────────────
    /api/v1/fetchers/{fetcherId}/fetchResults/generate:
        parameters:
            - $ref: '#/components/parameters/fetcherId'
            - $ref: '#/components/parameters/isAsync'
        post:
            security:
                - UserBearerAuth: []
                - ServiceBearerAuth: []
            tags:
                - Fetch Results
            summary: Generate a fetch result
            operationId: generateFetchResult
            description: |
                Claims a result for the given `date` and `fetcherConfig`. When `isAsync` is `false`,
                processing finishes before the response; when it is `true`, the initial `IN_PROGRESS`
                result is returned and processing continues in the background. If the same date and
                configuration already exist, the existing result is returned.

                Accepts a service token or a user token with the `SUPERADMIN` system role.
            requestBody:
                $ref: '#/components/requestBodies/GenerateFetchResultBody'
            responses:
                '200':
                    description: Fetch result created successfully (or existing duplicated result returned).
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/FetchResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/fetchers/{fetcherId}/fetchResults:
        parameters:
            - $ref: '#/components/parameters/fetcherId'
        get:
            security:
                - UserBearerAuth: []
                - ServiceBearerAuth: []
            tags:
                - Fetch Results
            summary: Get fetch results by fetcher ID
            operationId: getFetchResultsByFetcherId
            description: |
                Retrieves all fetch results associated with a given fetcher.
                Accepts a service token or a user token with the `SUPERADMIN` system role.
            responses:
                '200':
                    description: Fetch results retrieved successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/FetchResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            security:
                - UserBearerAuth: []
                - ServiceBearerAuth: []
            tags:
                - Fetch Results
            summary: Delete fetch results by fetcher ID
            operationId: deleteFetchResultsByFetcherId
            description: |
                Deletes all fetch results associated with a given fetcher.
                Accepts a service token or a user token with the `SUPERADMIN` system role.
            responses:
                '200':
                    description: Fetch results deleted successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/DeleteManyResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/fetchers/{fetcherId}/fetchResults/{fetchResultId}:
        parameters:
            - $ref: '#/components/parameters/fetcherId'
            - $ref: '#/components/parameters/fetchResultId'
        get:
            security:
                - UserBearerAuth: []
                - ServiceBearerAuth: []
            tags:
                - Fetch Results
            summary: Get fetch result by fetcher ID and fetch result ID
            operationId: getFetchResultByFetcherIdAndFetchResultId
            description: |
                Retrieves a single fetch result by fetcher ID and fetch result ID.
                Accepts a service token or a user token with the `SUPERADMIN` system role.
            responses:
                '200':
                    description: Fetch result retrieved successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/FetchResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            security:
                - UserBearerAuth: []
                - ServiceBearerAuth: []
            tags:
                - Fetch Results
            summary: Update fetch result by fetcher ID and fetch result ID
            operationId: updateFetchResultByFetcherIdAndFetchResultId
            description: |
                Partially updates a fetch result by fetcher ID and fetch result ID.
                Accepts a service token or a user token with the `SUPERADMIN` system role.
            requestBody:
                $ref: '#/components/requestBodies/UpdateFetchResultBody'
            responses:
                '200':
                    description: Fetch result updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/FetchResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            security:
                - UserBearerAuth: []
                - ServiceBearerAuth: []
            tags:
                - Fetch Results
            summary: Delete fetch result by fetcher ID and fetch result ID
            operationId: deleteFetchResultByFetcherIdAndFetchResultId
            description: |
                Deletes a fetch result by fetcher ID and fetch result ID.
                Accepts a service token or a user token with the `SUPERADMIN` system role.
            responses:
                '200':
                    description: Fetch result deleted successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/FetchResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

components:
    securitySchemes:
        UserBearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: |
                JWT whose `type` claim is `user`. Operations also state the minimum accepted
                `systemRole` (`ADMIN` or `SUPERADMIN`). Role priority is
                `USER < ADMIN < SUPERADMIN`.
        ServiceBearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT whose `type` claim is `service`.

    # ── Parameters ────────────────────────────
    parameters:
        fetcherId:
            name: fetcherId
            in: path
            required: true
            description: |
                Registered fetcher identifier. Current examples:
                `FT_REST_BLUEJAY_REPORTER_LOGS`, `FT_GQL_GITHUB_PROJECTV2_ITEMS`,
                `FT_GQL_GITHUB_PULL_REQUESTS`, `FT_GQL_GITHUB_ISSUES`, and
                `FT_GQL_ZENHUB_ISSUES`.
            schema:
                type: string
                example: FT_GQL_GITHUB_ISSUES
        fetchResultId:
            name: fetchResultId
            in: path
            required: true
            description: MongoDB ObjectId of the fetch result
            schema:
                type: string
                pattern: '^[a-fA-F0-9]{24}$'
                example: 67c9ff7b2ddf1b3940f9f321
        fetcherIdCandidate:
            name: fetcherId
            in: path
            required: true
            description: Fetcher identifier to check; it does not have to be registered.
            schema:
                type: string
                example: FT_GQL_GITHUB_ISSUES
        isAsync:
            name: isAsync
            in: query
            required: false
            description: If true, returns the claimed result and executes processing in the background.
            schema:
                type: boolean
                default: false
                example: false

    # ── Request Bodies ────────────────────────
    requestBodies:
        FetchFetcherBody:
            description: Request body for executing a fetcher
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            date:
                                type: string
                                format: date-time
                                description: Required ISO 8601 request date
                                example: '2026-04-10T09:30:00.000Z'
                            fetcherConfig:
                                $ref: '#/components/schemas/FetcherConfig'
                        required:
                            - date
                            - fetcherConfig
                    example:
                        date: '2026-04-10T09:30:00.000Z'
                        fetcherConfig:
                            owner: governify
                            repository: fetcher
                            token: github_pat_example
        ValidateFetcherBody:
            description: Optional request body containing the configuration to validate
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            fetcherConfig:
                                $ref: '#/components/schemas/FetcherConfig'
                    example:
                        fetcherConfig:
                            owner: governify
                            repository: fetcher
                            token: github_pat_example

        GenerateFetchResultBody:
            description: Request body for generating a fetch result
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            date:
                                type: string
                                format: date-time
                                description: Fetch date used to initialize the fetch result
                                example: '2026-04-10T09:30:00.000Z'
                            fetcherConfig:
                                $ref: '#/components/schemas/FetcherConfig'
                        required:
                            - date
                            - fetcherConfig
                    example:
                        date: '2026-04-10T09:30:00.000Z'
                        fetcherConfig:
                            owner: governify
                            repository: fetcher
                            token: github_pat_example

        UpdateFetchResultBody:
            description: Request body for updating a fetch result
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateFetchResultRequest'
                    example:
                        status: COMPLETED
                        startDate: '2026-04-06T10:59:55.000Z'
                        date: '2026-04-06T11:00:00.000Z'
                        endDate: '2026-04-06T11:00:00.000Z'
                        data: This is a placeholder for GitHub fetcher data

    # ── Reusable responses ────────────────────────
    responses:
        Unauthorized:
            description: Missing, malformed, invalid, expired, or unsupported token
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Authorization header missing or malformed
                        httpStatus: 401
                        appCode: UNAUTHORIZED
                        data: null
                        error:
                            message: Authorization header missing or malformed

        Forbidden:
            description: Authenticated user does not have the required system role
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Insufficient permissions
                        httpStatus: 403
                        appCode: FORBIDDEN
                        data: null
                        error:
                            message: Insufficient permissions

        ValidationError:
            description: Validation error in the submitted data
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Validation failed
                        httpStatus: 400
                        appCode: VALIDATION_ERROR
                        data: null
                        error:
                            message: Validation failed
                            details:
                                - type: field
                                  value: null
                                  msg: fetcherConfig is required
                                  path: fetcherConfig
                                  location: body

        NotFound:
            description: The requested resource does not exist
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Resource not found
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: Resource not found

        InternalError:
            description: Internal server error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Internal server error
                        httpStatus: 500
                        appCode: UNKNOWN_ERROR
                        data: null
                        error:
                            message: Internal server error

    schemas:
        # ── Standard response ────────────────────
        JsonValue:
            description: Any JSON-compatible value, including null
            anyOf:
                - type: object
                  nullable: true
                  additionalProperties: true
                - type: array
                  items: {}
                - type: string
                - type: number
                - type: boolean

        SuccessResponse:
            type: object
            description: Standard wrapper for all successful API responses
            additionalProperties: false
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: OK
                httpStatus:
                    type: integer
                    example: 200
                appCode:
                    type: string
                    example: SUCCESS
                data:
                    $ref: '#/components/schemas/JsonValue'
                error:
                    type: object
                    nullable: true
                    example: null
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        ErrorResponse:
            type: object
            description: Standard wrapper for all error API responses
            additionalProperties: false
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                httpStatus:
                    type: integer
                appCode:
                    type: string
                data:
                    type: object
                    nullable: true
                    example: null
                error:
                    type: object
                    properties:
                        message:
                            type: string
                        details:
                            $ref: '#/components/schemas/JsonValue'
                    required:
                        - message
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        # ── Fetcher ─────────────────────────
        Fetcher:
            type: object
            description: Serialized fetcher definition and metadata; the executable `fetch` function is omitted from JSON.
            additionalProperties: false
            properties:
                id:
                    type: string
                    description: Registered fetcher identifier
                    example: FT_GQL_GITHUB_ISSUES
                moreInfo:
                    $ref: '#/components/schemas/FetcherMoreInfo'
                fetcherConfigSchema:
                    type: object
                    description: Internal Zod schema serialized as JSON. Its structure is library-specific.
                    additionalProperties: true
                fetchScript:
                    type: string
                    description: String representation of the fetcher's executable function
                    example: 'async _fetcherConfig => ({ data: [] })'
            required:
                - id
                - moreInfo
                - fetcherConfigSchema
                - fetchScript

        FetcherMoreInfo:
            type: object
            description: Human-readable fetcher metadata
            additionalProperties: false
            properties:
                title:
                    type: string
                    example: GitHub Issues Fetcher
                description:
                    type: string
                    example: Fetches every raw issue of a GitHub repository.
                example:
                    type: string
                    example: ''
            required:
                - title
                - description
                - example

        FetcherConfig:
            description: |
                Fetcher-specific configuration. GitHub fetchers use `owner`, `repository`, and
                `token`; the ZenHub fetcher uses `workspaceId` and `token`; the Bluejay reporter
                logs fetcher uses an empty object.
            oneOf:
                - $ref: '#/components/schemas/EmptyFetcherConfig'
                - $ref: '#/components/schemas/GitHubFetcherConfig'
                - $ref: '#/components/schemas/ZenHubFetcherConfig'
            example:
                owner: governify
                repository: fetcher
                token: github_pat_example

        EmptyFetcherConfig:
            type: object
            description: Configuration for `FT_REST_BLUEJAY_REPORTER_LOGS`
            maxProperties: 0

        GitHubFetcherConfig:
            type: object
            description: Configuration shared by all `FT_GQL_GITHUB_*` fetchers
            additionalProperties: false
            properties:
                owner:
                    type: string
                    example: governify
                repository:
                    type: string
                    example: fetcher
                token:
                    type: string
                    description: GitHub token used by the upstream GraphQL request
                    example: github_pat_example
            required:
                - owner
                - repository
                - token

        ZenHubFetcherConfig:
            type: object
            description: Configuration for `FT_GQL_ZENHUB_ISSUES`
            additionalProperties: false
            properties:
                workspaceId:
                    type: string
                    example: 5f1234567890abcdef123456
                token:
                    type: string
                    description: ZenHub token used by the upstream GraphQL request
                    example: zenhub_token_example
            required:
                - workspaceId
                - token

        FetcherExecutionResult:
            type: object
            description: Result returned by a fetcher execution
            additionalProperties: false
            properties:
                data:
                    $ref: '#/components/schemas/JsonValue'
            required:
                - data
            example:
                data: []

        ValidateFetcherIssue:
            type: object
            description: Validation issue returned by Zod when the configuration is invalid
            additionalProperties: true
            properties:
                code:
                    type: string
                    example: invalid_type
                expected:
                    type: string
                    example: string
                path:
                    type: array
                    items:
                        oneOf:
                            - type: string
                            - type: integer
                    example:
                        - owner
                message:
                    type: string
                    example: 'Invalid input: expected string, received undefined'
            required:
                - code
                - path
                - message

        ValidateFetcherResult:
            type: object
            description: Fetcher existence and configuration validation result
            additionalProperties: false
            properties:
                valid:
                    type: boolean
                    example: true
                error:
                    type: string
                    example: Invalid fetcherConfig
                issues:
                    type: array
                    items:
                        $ref: '#/components/schemas/ValidateFetcherIssue'
            required:
                - valid

        FetchResult:
            type: object
            description: Fetch result entity persisted in MongoDB
            additionalProperties: false
            properties:
                _id:
                    type: string
                    example: 67c9ff7b2ddf1b3940f9f321
                startDate:
                    type: string
                    format: date-time
                    example: '2026-04-06T10:59:55.000Z'
                endDate:
                    type: string
                    format: date-time
                    nullable: true
                    example: '2026-04-06T11:00:00.000Z'
                date:
                    type: string
                    format: date-time
                    example: '2026-04-06T11:00:00.000Z'
                status:
                    type: string
                    enum: [IN_PROGRESS, COMPLETED, FAILED]
                    example: COMPLETED
                fetcherConfig:
                    $ref: '#/components/schemas/FetcherConfig'
                data:
                    $ref: '#/components/schemas/JsonValue'
                createdAt:
                    type: string
                    format: date-time
                    example: '2026-04-06T10:59:55.000Z'
                updatedAt:
                    type: string
                    format: date-time
                    example: '2026-04-06T11:00:00.000Z'
                __v:
                    type: integer
                    description: MongoDB document version
                    example: 0
            required:
                - _id
                - startDate
                - endDate
                - date
                - status
                - fetcherConfig
                - data
                - createdAt
                - updatedAt
                - __v

        UpdateFetchResultRequest:
            type: object
            description: Partial payload for updating a fetch result
            additionalProperties: false
            properties:
                startDate:
                    type: string
                    format: date-time
                endDate:
                    type: string
